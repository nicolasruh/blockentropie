<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blockentropie</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-i18n="title">Blockentropie</h1>
    <label class="lang"><span data-i18n="language">Sprache</span>
      <select id="lang"><option value="de">Deutsch</option><option value="en">English</option></select>
    </label>
  </header>

  <main>
    <section class="panel">
      <div class="row">
        <label class="grow"><span data-i18n="textLabel">Nachricht:</span>
          <textarea id="text" rows="1" wrap="off" autocomplete="off" spellcheck="false" data-i18n-placeholder="textPlaceholder">ABRAKADABRA</textarea>
        </label>
        <button id="loadBtn" data-i18n="loadFile">Datei laden …</button>
        <input type="file" id="file" hidden>
      </div>
      <p id="inputInfo" class="note"></p>
    </section>

    <section id="bitsPanel" class="panel" hidden>
      <div class="head">
        <h2 data-i18n="bitsTitle">Bitfolge</h2>
        <div class="controls">
          <label><span data-i18n="blockSize">Blockgröße n:</span> <select id="blockSize" autocomplete="off"></select></label>
          <label class="sub"><input type="checkbox" id="spaces" autocomplete="off"> <span data-i18n="spaces">Abstände zwischen den Blöcken</span></label>
        </div>
      </div>
      <div id="bits" class="bits mono"></div>
      <p id="bitsInfo" class="note"></p>
    </section>

    <section id="calcPanel" class="panel" hidden>
      <div class="head">
        <h2 data-i18n="tableTitle">Blöcke</h2>
        <fieldset>
          <legend data-i18n="modeLabel">Modus:</legend>
          <label><input type="radio" name="mode" value="show" checked autocomplete="off"> <span data-i18n="modeShow">Anzeigen</span></label>
          <label><input type="radio" name="mode" value="build" autocomplete="off"> <span data-i18n="modeBuild">Selbst festlegen</span></label>
        </fieldset>
      </div>
      <div class="two">
        <div>
          <div id="table" class="scroll"></div>
          <p id="rowsInfo" class="note"></p>
        </div>
        <div id="formula"></div>
      </div>
    </section>
    <section id="cmpPanel" class="panel" hidden>
      <div class="head">
        <h2 data-i18n="cmpTitle">Blockgrößen vergleichen</h2>
        <button id="cmpBtn" data-i18n="cmpBtn">Blockgrößen vergleichen</button>
      </div>
      <p class="note" data-i18n="cmpHint"></p>
      <div id="cmp"></div>
    </section>
  </main>

  <script src="js/entropy.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
